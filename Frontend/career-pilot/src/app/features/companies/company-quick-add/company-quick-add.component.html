<div class="backdrop" (click)="cancelled.emit()">
  <div class="dialog card" (click)="$event.stopPropagation()">
    <h3>Add a new company</h3>

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="quickCompanyName">Company name</label>
        <input id="quickCompanyName" formControlName="name" appAutofocus />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <span class="field-error">Company name is required.</span>
        }
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="quickCompanyCountry">Country</label>
          <input id="quickCompanyCountry" formControlName="country" />
        </div>
        <div class="form-field">
          <label for="quickCompanyWebsite">Website</label>
          <input id="quickCompanyWebsite" formControlName="website" placeholder="https://example.com" />
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Add company' }}
        </button>
      </div>
    </form>
  </div>
</div>
