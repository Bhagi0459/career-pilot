<div class="app-layout">
  <aside class="sidebar">
    <div class="logo">CareerPilot</div>

    <nav>
      <ul>
        <li>
          <a routerLink="/dashboard" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/applications" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
              <path d="M14 3v4h4M9 12h6M9 16h6" />
            </svg>
            Applications
          </a>
        </li>
        <li>
          <a routerLink="/companies" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="3" width="16" height="18" rx="1" />
              <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" />
            </svg>
            Companies
          </a>
        </li>
        <li>
          <a routerLink="/recruiters" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="3.25" />
              <path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" />
            </svg>
            Recruiters
          </a>
        </li>
        <li>
          <a routerLink="/interviews" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4.5" width="18" height="16" rx="1.5" />
              <path d="M3 9.5h18M8 3v3M16 3v3" />
            </svg>
            Interviews
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <h2>CareerPilot</h2>
      <div class="topbar-user">
        <span class="user-email">{{ currentUserEmail() }}</span>
        <button type="button" class="btn btn-secondary" (click)="logout()">Sign out</button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
