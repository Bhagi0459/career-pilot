<div class="app-layout">
  <header class="mobile-bar">
    <div class="brand">
      <span class="brand-mark">CP</span>
      <span class="brand-name">CareerPilot</span>
    </div>
    <button
      type="button"
      class="nav-toggle"
      (click)="toggleMobileNav()"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="primary-nav"
      aria-label="Toggle navigation menu"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </header>

  <aside class="sidebar" [class.open]="mobileNavOpen()">
    <div class="brand brand-desktop">
      <span class="brand-mark">CP</span>
      <span class="brand-name">CareerPilot</span>
    </div>

    <nav id="primary-nav">
      <ul>
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/applications" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
              <path d="M14 3v4h4M9 12h6M9 16h6" />
            </svg>
            Applications
          </a>
        </li>
        <li>
          <a routerLink="/companies" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="3" width="16" height="18" rx="1" />
              <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" />
            </svg>
            Companies
          </a>
        </li>
        <li>
          <a routerLink="/recruiters" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="3.25" />
              <path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" />
            </svg>
            Recruiters
          </a>
        </li>
        <li>
          <a routerLink="/interviews" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4.5" width="18" height="16" rx="1.5" />
              <path d="M3 9.5h18M8 3v3M16 3v3" />
            </svg>
            Interviews
          </a>
        </li>
      </ul>

      <ul class="nav-secondary">
        <li>
          <a routerLink="/settings" routerLinkActive="active" (click)="closeMobileNav()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            Settings
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  @if (mobileNavOpen()) {
    <button type="button" class="nav-scrim" (click)="closeMobileNav()" aria-label="Close navigation menu"></button>
  }

  <div class="main-content">
    <header class="topbar">
      <h1 class="page-title">{{ pageTitle() }}</h1>

      <div class="topbar-user">
        <div class="user-info">
          <span class="user-name">{{ currentUserDisplayName() || currentUserEmail() }}</span>
          @if (currentUserDisplayName()) {
            <span class="user-email">{{ currentUserEmail() }}</span>
          }
        </div>
        <button type="button" class="btn btn-secondary btn-signout" (click)="logout()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span class="signout-label">Sign out</span>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
